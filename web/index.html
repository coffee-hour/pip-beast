<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pip-Beast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0a0a; --panel:#171717; --line:#262626; --amber:#ffffff; --dim:#737373; --text:#ffffff; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:'JetBrains Mono', ui-monospace, monospace; font-size:14px; }
  body { display:grid; grid-template-rows:auto 1fr auto; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 18px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:16px; color:var(--amber); letter-spacing:.18em; }
  #status { color:var(--dim); font-size:12px; }
  main { display:grid; grid-template-columns:1fr 260px; min-height:0; }
  #log { overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:14px; }
  .msg { white-space:pre-wrap; word-wrap:break-word; border-left:2px solid var(--line); padding:6px 12px; }
  .msg.you { border-color:var(--dim); color:#a3a3a3; }
  .msg.pip { border-color:var(--amber); }
  .msg .who { display:block; color:var(--amber); font-size:11px; letter-spacing:.12em; margin-bottom:4px; }
  .msg.you .who { color:var(--dim); }
  aside { border-left:1px solid var(--line); background:var(--panel); padding:18px; display:flex; flex-direction:column; gap:18px; }
  label { display:block; color:var(--dim); font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-bottom:6px; }
  .row { display:flex; justify-content:space-between; align-items:baseline; }
  .row span { color:var(--amber); font-size:12px; }
  input[type=range] { width:100%; accent-color:var(--amber); }
  input[type=checkbox] { accent-color:var(--amber); width:16px; height:16px; }
  button { background:transparent; color:var(--amber); border:1px solid var(--amber); padding:8px 12px; font:inherit; cursor:pointer; }
  button:hover { background:var(--amber); color:#0a0a0a; }
  button:disabled { opacity:.4; cursor:default; }
  .toggle { display:flex; align-items:center; justify-content:space-between; }
  .note { color:var(--dim); font-size:11px; line-height:1.5; }
  footer { display:flex; gap:10px; padding:14px 18px; border-top:1px solid var(--line); }
  textarea { flex:1; background:var(--panel); color:var(--text); border:1px solid var(--line); padding:10px; font:inherit; resize:none; height:64px; }
  textarea:focus { outline:1px solid var(--amber); }
  html { scrollbar-color:#404040 #0a0a0a; scrollbar-width:thin; }
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-track { background:#0a0a0a; }
  ::-webkit-scrollbar-thumb { background:#404040; border:2px solid #0a0a0a; }
  ::-webkit-scrollbar-thumb:hover { background:#737373; }
  @media (max-width:760px) { main { grid-template-columns:1fr; } aside { border-left:0; border-top:1px solid var(--line); } }
</style>
</head>
<body>
<header><h1>PIP-BEAST</h1><span id="status">connecting...</span></header>
<main>
  <section id="log"></section>
  <aside>
    <div>
      <div class="row"><label>temperature</label><span id="tempVal"></span></div>
      <input id="temp" type="range" min="0.1" max="1.5" step="0.05" value="0.8">
    </div>
    <div>
      <div class="row"><label>top-k</label><span id="topkVal"></span></div>
      <input id="topk" type="range" min="0" max="200" step="1" value="40">
    </div>
    <div>
      <div class="row"><label>max tokens</label><span id="maxVal"></span></div>
      <input id="maxnew" type="range" min="16" max="1024" step="16" value="200">
    </div>
    <div class="toggle">
      <label style="margin:0">satellites</label>
      <input id="sat" type="checkbox">
    </div>
    <div class="note" id="satNote"></div>
    <button id="reset">reset conversation</button>
    <div class="note">Sliders apply to the core model. Satellite replies are produced whole by the orchestrator and then shown in chunks.</div>
  </aside>
</main>
<footer>
  <textarea id="input" placeholder="message pip... (enter sends, shift+enter for newline)"></textarea>
  <button id="send">send</button>
</footer>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $('log'), input = $('input'), sendBtn = $('send');
  let busy = false;

  const sliders = [['temp', 'tempVal', v => (+v).toFixed(2)], ['topk', 'topkVal', v => v], ['maxnew', 'maxVal', v => v]];
  for (const [id, out, fmt] of sliders) {
    const el = $(id), o = $(out);
    const upd = () => { o.textContent = fmt(el.value); };
    el.addEventListener('input', upd);
    upd();
  }

  function addMsg(kind, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = kind === 'you' ? 'you' : 'pip';
    const body = document.createTextNode(text);
    div.append(who, body);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return body;
  }

  function setBusy(v) { busy = v; sendBtn.disabled = v; }

  function handleEvent(block, node) {
    let ev = 'message', data = '';
    for (const line of block.split('\n')) {
      if (line.startsWith('event: ')) ev = line.slice(7);
      else if (line.startsWith('data: ')) data += line.slice(6);
    }
    if (!data) return;
    const d = JSON.parse(data);
    if (ev === 'token') node.textContent += d.text;
    else if (ev === 'error') node.textContent += '\n[error: ' + d.message + ']';
  }

  async function send() {
    const msg = input.value.trim();
    if (!msg || busy) return;
    input.value = '';
    setBusy(true);
    addMsg('you', msg);
    const node = addMsg('pip', '');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: msg,
          temperature: +$('temp').value,
          top_k: +$('topk').value,
          max_new_tokens: +$('maxnew').value,
        }),
      });
      if (!res.ok) { node.textContent = '[HTTP ' + res.status + ']'; return; }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const block = buf.slice(0, i);
          buf = buf.slice(i + 2);
          handleEvent(block, node);
          log.scrollTop = log.scrollHeight;
        }
      }
    } catch (e) {
      node.textContent += '\n[connection lost: ' + e.message + ']';
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  async function loadStatus() {
    try {
      const s = await (await fetch('/api/status')).json();
      $('status').textContent = `${s.model} | ${(s.params / 1e6).toFixed(0)}M params | ${s.device} | ctx ${s.context}`;
      $('sat').disabled = !s.satellites_available;
      $('sat').checked = s.satellites_on;
      $('satNote').textContent = s.satellites_available ? '' :
        ('satellites unavailable' + (s.satellite_error ? ': ' + s.satellite_error : ''));
    } catch (e) {
      $('status').textContent = 'server unreachable';
    }
  }

  $('sat').addEventListener('change', async (e) => {
    const res = await fetch('/api/satellites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: e.target.checked }),
    });
    if (!res.ok) e.target.checked = !e.target.checked;
    loadStatus();
  });

  $('reset').addEventListener('click', async () => {
    if (busy) return;
    await fetch('/api/reset', { method: 'POST' });
    log.textContent = '';
  });

  sendBtn.addEventListener('click', send);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  loadStatus();
  input.focus();
})();
</script>
</body>
</html>
