<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pip-beast</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #000; --fg: #ececec; --mid: #8a8a8a; --dim: #4a4a4a; --line: #242424; --bubble: #141414; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
    font-size: 15px; line-height: 1.5;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
  }
  header h1 { font-size: 15px; font-weight: 700; margin: 0; letter-spacing: 0.02em; }
  #status { font-size: 12px; color: var(--mid); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #controls { display: flex; gap: 10px; align-items: baseline; font-size: 12px; color: var(--mid); }
  #controls label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  #controls input[type=checkbox] { accent-color: var(--fg); margin: 0; }
  #reset { background: transparent; color: var(--mid); border: 1px solid var(--line); padding: 2px 8px; font: inherit; font-size: 12px; font-weight: 400; border-radius: 999px; cursor: pointer; }
  #reset:hover { color: var(--fg); border-color: var(--mid); }
  #reset:disabled { opacity: .4; cursor: default; }
  #log {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
    max-width: 760px; width: 100%; margin: 0 auto;
  }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.you { align-self: flex-end; background: var(--fg); color: var(--bg); border-bottom-right-radius: 4px; }
  .msg.pip { align-self: flex-start; background: var(--bubble); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.sys { align-self: center; color: var(--mid); font-size: 13px; }
  .empty { margin: auto; color: var(--dim); text-align: center; font-size: 14px; }
  form {
    border-top: 1px solid var(--line); padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto;
  }
  #input {
    flex: 1; min-width: 0; background: var(--bg); color: var(--fg);
    border: 1px solid var(--dim); border-radius: 999px; padding: 10px 16px; font: inherit; outline: none;
  }
  #input:focus { border-color: var(--mid); }
  #input::placeholder { color: var(--dim); }
  button#send {
    background: var(--fg); color: var(--bg); border: 0; border-radius: 999px;
    padding: 10px 18px; font: inherit; font-weight: 700; cursor: pointer;
  }
  button#send:disabled { background: var(--dim); color: var(--bg); cursor: default; }
  @media (max-width: 480px) {
    body { font-size: 14px; }
    .msg { max-width: 90%; }
    header, #log, form { padding-left: 14px; padding-right: 14px; }
    #controls { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<header>
  <h1>pip-beast</h1>
  <div id="controls">
    <span id="status">connecting...</span>
    <label id="satLabel" title="satellite subsystem"><input id="sat" type="checkbox"> satellites</label>
    <button id="reset" type="button">reset</button>
  </div>
</header>

<div id="log">
  <div class="empty" id="empty">A 1.11B parameter model running on your local machine. Replies are generated by the server.</div>
</div>

<form id="form" autocomplete="off">
  <input id="input" type="text" placeholder="Message Pip" aria-label="Message Pip">
  <button id="send" type="submit">Send</button>
</form>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const logEl = $('log'), form = $('form'), input = $('input'), sendBtn = $('send');
  const statusEl = $('status'), satEl = $('sat'), resetBtn = $('reset');
  let emptyEl = $('empty');
  let busy = false;

  function addMsg(kind, text) {
    if (emptyEl) { emptyEl.remove(); emptyEl = null; }
    const div = document.createElement('div');
    div.className = 'msg ' + kind;
    div.textContent = text;
    logEl.appendChild(div);
    logEl.scrollTop = logEl.scrollHeight;
    return div;
  }

  function setBusy(v) {
    busy = v;
    sendBtn.disabled = v;
    resetBtn.disabled = v;
  }

  function handleEvent(block, node) {
    let ev = 'message', data = '';
    for (const line of block.split('\n')) {
      if (line.startsWith('event: ')) ev = line.slice(7);
      else if (line.startsWith('data: ')) data += line.slice(6);
    }
    if (!data) return;
    const d = JSON.parse(data);
    if (ev === 'token') node.textContent += d.text;
    else if (ev === 'error') node.textContent += '\n[error: ' + d.message + ']';
  }

  async function send() {
    const msg = input.value.trim();
    if (!msg || busy) return;
    input.value = '';
    setBusy(true);
    addMsg('you', msg);
    const node = addMsg('pip', '');
    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: msg, temperature: 0.8, top_k: 40, max_new_tokens: 200 }),
      });
      if (!res.ok) { node.textContent = '[HTTP ' + res.status + ']'; return; }
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let i;
        while ((i = buf.indexOf('\n\n')) >= 0) {
          const block = buf.slice(0, i);
          buf = buf.slice(i + 2);
          handleEvent(block, node);
          logEl.scrollTop = logEl.scrollHeight;
        }
      }
    } catch (e) {
      node.textContent += '\n[connection lost: ' + e.message + ']';
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  async function loadStatus() {
    try {
      const s = await (await fetch('/api/status')).json();
      statusEl.textContent = `${s.model} | ${(s.params / 1e6).toFixed(0)}M params | ${s.device} | ctx ${s.context}`;
      satEl.disabled = !s.satellites_available;
      satEl.checked = s.satellites_on;
      if (!s.satellites_available && s.satellite_error) satEl.title = 'unavailable: ' + s.satellite_error;
    } catch (e) {
      statusEl.textContent = 'server unreachable';
    }
  }

  satEl.addEventListener('change', async (e) => {
    const res = await fetch('/api/satellites', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: e.target.checked }),
    });
    if (!res.ok) e.target.checked = !e.target.checked;
    loadStatus();
  });

  resetBtn.addEventListener('click', async () => {
    if (busy) return;
    await fetch('/api/reset', { method: 'POST' });
    logEl.textContent = '';
    emptyEl = null;
    addMsg('sys', 'chat cleared');
  });

  form.addEventListener('submit', (e) => { e.preventDefault(); send(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });

  loadStatus();
  input.focus();
})();
</script>
</body>
</html>
